<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta {{ codigo_niif }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
    <style>
        @page {
            size: 58mm auto;
            margin: 0;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            background: #f2f2f2;
        }
        .label {
            width: 58mm;
            padding: 3mm 2mm;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .empresa {
            font-size: 15pt;
            font-weight: bold;
            letter-spacing: 0.5pt;
            margin: 0;
        }
        .slogan {
            font-size: 6.5pt;
            margin: 0 0 2mm;
        }
        .codigo-texto {
            font-size: 8pt;
            letter-spacing: 1pt;
            margin: 0.5mm 0 1.5mm;
        }
        .separador {
            width: 100%;
            border-top: 0.5pt solid #000;
            margin: 1.5mm 0;
        }
        .capacidad {
            font-size: 11pt;
            font-weight: bold;
            margin: 0;
        }
        .error-box {
            padding: 2rem;
            font-family: sans-serif;
            text-align: center;
            color: #a32d2d;
        }
        .no-imprimir {
            text-align: center;
            margin: 12px 0;
            font-family: sans-serif;
        }
        @media print {
            body { background: #fff; }
            .no-imprimir { display: none; }
        }
    </style>
</head>
<body>

{% if error %}
    <div class="error-box">
        <p>{{ error }}</p>
    </div>
{% else %}
    <div>
        <div class="label">
            <p class="empresa">VIDAGAS</p>
            <p class="slogan">mas vida, mas gas</p>
            <svg id="barcode"></svg>
            <p class="codigo-texto">{{ cilindro.codigo_niif }}</p>
            <div class="separador"></div>
            <p class="capacidad">CILINDROS DE {{ cilindro.tipo.capacidad|floatformat:"-2" }}K</p>
        </div>
        <div class="no-imprimir">
            <button onclick="window.print()">Imprimir</button>
        </div>
    </div>

    <script>
        JsBarcode("#barcode", "{{ cilindro.codigo_niif }}", {
            format: "CODE128",
            displayValue: false,
            height: 35,
            width: 1.3,
            margin: 0
        });
        window.onload = function () {
            window.print();
        };
    </script>
{% endif %}

</body>
</html>
