{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta {{ codigo_niif }}</title>

    <link rel="stylesheet" href="{% static 'css/etiqueta.css' %}">
    <script src="{% static 'js/JsBarcode.all.min.js' %}"></script>
</head>

<body>

{% if error %}

    <div class="error-box">
        <p>{{ error }}</p>
    </div>

{% else %}

    <div>
        <div class="label">
            <p class="empresa">VIDAGAS</p>
            <p class="slogan">más vida, más gas</p>

            <svg id="barcode"></svg>

            <p class="codigo-texto">
                {{ cilindro.codigo_niif }}
            </p>

            <div class="separador"></div>

            <p class="capacidad">
                CILINDROS DE {{ cilindro.tipo.capacidad|floatformat:"-2" }}K
            </p>
        </div>

        <div class="no-imprimir">
            <button onclick="window.print()">
                Imprimir
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof JsBarcode !== "undefined") {
                JsBarcode("#barcode", "{{ cilindro.codigo_niif }}", {
                    format: "CODE128",
                    displayValue: false,
                    height: 40,
                    width: 1.5,
                    margin: 0
                });
            }

            // Auto-imprimir con un pequeño retardo para asegurar renderizado del SVG
            setTimeout(function () {
                window.print();
            }, 300);
        });
    </script>

{% endif %}

</body>
</html>
