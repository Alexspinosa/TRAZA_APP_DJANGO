{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta {{ codigo_niif }}</title>

    <link rel="stylesheet" href="{% static 'css/etiqueta.css' %}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
</head>

<body>

{% if error %}

    <div class="error-box">
        <p>{{ error }}</p>
    </div>

{% else %}

    <div>
        <div class="label">
            <p class="empresa">VIDAGAS</p>
            <p class="slogan">más vida, más gas</p>

            <svg id="barcode"></svg>

            <p class="codigo-texto">
                {{ cilindro.codigo_niif }}
            </p>

            <div class="separador"></div>

            <p class="capacidad">
                CILINDROS DE {{ cilindro.tipo.capacidad|floatformat:"-2" }}K
            </p>
        </div>

        <div class="no-imprimir">
            <button onclick="window.print()">
                Imprimir
            </button>
        </div>
    </div>


    <script>
        JsBarcode("#barcode", "{{ cilindro.codigo_niif }}", {
            format: "CODE128",
            displayValue: false,
            height: 35,
            width: 1.3,
            margin: 0
        });

        window.onload = function () {
            window.print();
        };
    </script>

{% endif %}

</body>
</html>
